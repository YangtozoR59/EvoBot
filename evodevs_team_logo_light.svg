  <!-- Micro tagline -->
  <text x="330" y="292" font-family="'Space Grotesk', 'Arial', sans-serif" font-weight="300" font-size="11" fill="#aaaaaa" letter-spacing="3" style="fill:rgb(138, 138, 138);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Space Grotesk&quot;, &quot;Arial&quot;, sans-serif;font-size:11px;font-weight:300;text-anchor:start;dominant-baseline:auto">DIGITAL EVOLUTION</text>

  <!-- Small teal accent square before TEAM -->
  <rect x="312" y="255" width="6" height="6" rx="1" fill="#1b8a72" style="fill:rgb(27, 138, 114);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

