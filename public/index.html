<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Evodevs App — Solutions Web & Mini Apps</title>
  <meta name="description" content="Evodevs App : solutions digitales et web sur mesure pour PME et entrepreneurs. Services premium, livraison rapide et tarifs transparents.">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="app">
    <!-- Rendu dynamique par app.js -->
  </div>

  <!-- Sélecteur de Langue Flottant -->
  <button id="lang-switcher" class="lang-switcher" onclick="setLanguage(currentLang === 'fr' ? 'en' : 'fr')" aria-label="Changer de langue">
    <span class="lang-text" id="lang-text">EN</span>
  </button>

  <!-- Navigation Inférieure -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-page="home" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-item" data-page="services" id="nav-services">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Services</span>
    </button>
    <button class="nav-item" data-page="policy" id="nav-policy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Engagements</span>
    </button>
    <button class="nav-item" data-page="about" id="nav-about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>À propos</span>
    </button>
  </nav>

  <!-- Modal Détail du Service -->
  <div class="modal-overlay" id="serviceModal" onclick="if(event.target===this)closeModal('serviceModal')">
    <div class="modal-content" id="serviceModalContent">
      <div class="modal-handle"></div>
      <div id="serviceModalBody"></div>
    </div>
  </div>

  <!-- Modal Formulaire de Commande -->
  <div class="modal-overlay" id="orderModal" onclick="if(event.target===this)closeModal('orderModal')">
    <div class="modal-content" id="orderModalContent">
      <div class="modal-handle"></div>
      <div id="orderModalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
