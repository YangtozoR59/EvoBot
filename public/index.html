<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Evodevs Team — Transformation Digitale</title>
  <meta name="description" content="Evodevs Team : collectif de développeurs pour votre transformation digitale. Sites web, apps mobiles, bots Telegram et plus.">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="app">
    <!-- Pages are rendered dynamically by app.js -->
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-page="home" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-item" data-page="services" id="nav-services">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Services</span>
    </button>
    <button class="nav-item" data-page="policy" id="nav-policy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Politique</span>
    </button>
    <button class="nav-item" data-page="about" id="nav-about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>À propos</span>
    </button>
  </nav>

  <!-- Service Detail Modal -->
  <div class="modal-overlay" id="serviceModal">
    <div class="modal-content" id="serviceModalContent">
      <div class="modal-handle"></div>
      <div id="serviceModalBody"></div>
    </div>
  </div>

  <!-- Order Form Modal -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content" id="orderModalContent">
      <div class="modal-handle"></div>
      <div id="orderModalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
