<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <title>Evodevs Team Logo - Dark</title>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#2ab89a" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background — gris foncé doux au lieu du noir -->
  <rect width="680" height="340" fill="#2a2a2e"/>

  <!-- Background dots -->
  <circle cx="60"  cy="50"  r="2"   fill="#2ab89a" opacity="0.25"/>
  <circle cx="100" cy="35"  r="1.5" fill="#2ab89a" opacity="0.18"/>
  <circle cx="140" cy="55"  r="2"   fill="#2ab89a" opacity="0.2"/>
  <circle cx="80"  cy="90"  r="1.5" fill="#2ab89a" opacity="0.15"/>
  <circle cx="620" cy="80"  r="2"   fill="#2ab89a" opacity="0.25"/>
  <circle cx="645" cy="120" r="1.5" fill="#2ab89a" opacity="0.18"/>
  <circle cx="610" cy="155" r="1"   fill="#2ab89a" opacity="0.15"/>
  <circle cx="655" cy="200" r="2"   fill="#2ab89a" opacity="0.2"/>
  <circle cx="60"  cy="300" r="2"   fill="#2ab89a" opacity="0.2"/>
  <circle cx="140" cy="295" r="1"   fill="#2ab89a" opacity="0.15"/>

  <!-- Outer ring -->
  <circle cx="190" cy="170" r="100" fill="none" stroke="#2ab89a" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Inner thin ring -->
  <circle cx="190" cy="170" r="92"  fill="none" stroke="#2ab89a" stroke-width="0.7" opacity="0.3"/>

  <!-- Cardinal dots -->
  <circle cx="190" cy="66"  r="4.5" fill="#2ab89a" filter="url(#glow)"/>
  <circle cx="294" cy="170" r="4.5" fill="#2ab89a" filter="url(#glow)"/>
  <circle cx="190" cy="274" r="4.5" fill="#2ab89a" filter="url(#glow)"/>
  <circle cx="86"  cy="170" r="4.5" fill="#2ab89a" filter="url(#glow)"/>

  <!-- Monogram E — blanc cassé -->
  <rect x="128" y="118" width="11" height="104" rx="2" fill="#e8e8e8"/>
  <rect x="128" y="118" width="55" height="11"  rx="2" fill="#e8e8e8"/>
  <rect x="128" y="164" width="43" height="9"   rx="2" fill="#e8e8e8"/>
  <rect x="128" y="211" width="55" height="11"  rx="2" fill="#e8e8e8"/>

  <!-- Monogram D — blanc cassé -->
  <rect x="196" y="118" width="11" height="104" rx="2" fill="#e8e8e8"/>
  <path d="M207 118 Q266 118 266 170 Q266 222 207 222 L207 211 Q247 211 247 170 Q247 129 207 129 Z" fill="#e8e8e8"/>

  <!-- Teal accent on D -->
  <rect x="196" y="211" width="11" height="11" rx="1" fill="#2ab89a"/>

  <!-- Wordmark "Evo" -->
  <text x="330" y="148"
    font-family="'Syne','Arial Black',sans-serif"
    font-weight="800" font-size="68" fill="#e8e8e8" letter-spacing="-1">Evo</text>

  <!-- Wordmark "Devs" -->
  <text x="330" y="220"
    font-family="'Syne','Arial Black',sans-serif"
    font-weight="800" font-size="68" fill="#e8e8e8" letter-spacing="-1">Dev<tspan fill="#2ab89a">s</tspan></text>

  <!-- Separator -->
  <line x1="330" y1="238" x2="620" y2="238" stroke="#2ab89a" stroke-width="1.2" opacity="0.6"/>

  <!-- Accent square -->
  <rect x="312" y="255" width="6" height="6" rx="1" fill="#2ab89a"/>

  <!-- TEAM -->
  <text x="330" y="268"
    font-family="'Space Grotesk','Arial',sans-serif"
    font-weight="300" font-size="16" fill="#aaaaaa" letter-spacing="8">TEAM</text>

  <!-- Tagline -->
  <text x="330" y="292"
    font-family="'Space Grotesk','Arial',sans-serif"
    font-weight="300" font-size="11" fill="#666666" letter-spacing="3">DIGITAL EVOLUTION</text>

</svg>
