<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <title>Evodevs Team Logo</title>
  <desc>Logo de Evodevs Team : monogramme ED dans un cercle avec réseau de points décoratifs et typographie moderne</desc>

  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#1a9e7a" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background dots -->
  <circle cx="60"  cy="50"  r="2"   fill="#d0ede8" opacity="0.4"/>
  <circle cx="100" cy="35"  r="1.5" fill="#d0ede8" opacity="0.3"/>
  <circle cx="140" cy="55"  r="2"   fill="#d0ede8" opacity="0.35"/>
  <circle cx="80"  cy="90"  r="1.5" fill="#d0ede8" opacity="0.25"/>
  <circle cx="125" cy="80"  r="1"   fill="#d0ede8" opacity="0.2"/>
  <circle cx="620" cy="80"  r="2"   fill="#d0ede8" opacity="0.4"/>
  <circle cx="645" cy="120" r="1.5" fill="#d0ede8" opacity="0.3"/>
  <circle cx="610" cy="155" r="1"   fill="#d0ede8" opacity="0.25"/>
  <circle cx="655" cy="200" r="2"   fill="#d0ede8" opacity="0.3"/>
  <circle cx="625" cy="240" r="1.5" fill="#d0ede8" opacity="0.25"/>
  <circle cx="100" cy="280" r="1.5" fill="#d0ede8" opacity="0.3"/>
  <circle cx="60"  cy="300" r="2"   fill="#d0ede8" opacity="0.35"/>
  <circle cx="140" cy="295" r="1"   fill="#d0ede8" opacity="0.2"/>

  <!-- Outer ring -->
  <circle cx="190" cy="170" r="100" fill="none" stroke="#1b8a72" stroke-width="4" filter="url(#soft-glow)"/>
  <!-- Inner thin ring -->
  <circle cx="190" cy="170" r="92"  fill="none" stroke="#c8eee6" stroke-width="0.8" opacity="0.5"/>

  <!-- Cardinal accent dots -->
  <circle cx="190" cy="66"  r="4.5" fill="#1b8a72" filter="url(#soft-glow)"/>
  <circle cx="294" cy="170" r="4.5" fill="#1b8a72" filter="url(#soft-glow)"/>
  <circle cx="190" cy="274" r="4.5" fill="#1b8a72" filter="url(#soft-glow)"/>
  <circle cx="86"  cy="170" r="4.5" fill="#1b8a72" filter="url(#soft-glow)"/>

  <!-- Monogram E -->
  <rect x="128" y="118" width="12" height="104" rx="2" fill="#1e1e1e"/>
  <rect x="128" y="118" width="56" height="12"  rx="2" fill="#1e1e1e"/>
  <rect x="128" y="164" width="44" height="10"  rx="2" fill="#1e1e1e"/>
  <rect x="128" y="210" width="56" height="12"  rx="2" fill="#1e1e1e"/>

  <!-- Monogram D -->
  <rect x="196" y="118" width="12" height="104" rx="2" fill="#1e1e1e"/>
  <path d="M208 118 Q268 118 268 170 Q268 222 208 222 L208 210 Q248 210 248 170 Q248 130 208 130 Z" fill="#1e1e1e"/>

  <!-- Teal accent on D -->
  <rect x="196" y="210" width="12" height="12" rx="1" fill="#1b8a72"/>

  <!-- Wordmark "Evo" -->
  <text
    x="330" y="148"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="68"
    fill="#1e1e1e"
    letter-spacing="-1">Evo</text>

  <!-- Wordmark "Devs" with teal "s" -->
  <text
    x="330" y="220"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="68"
    fill="#1e1e1e"
    letter-spacing="-1">Dev<tspan fill="#1b8a72">s</tspan></text>

  <!-- Separator line -->
  <line x1="330" y1="238" x2="620" y2="238" stroke="#1b8a72" stroke-width="1.5" opacity="0.7"/>

  <!-- Teal accent square before TEAM -->
  <rect x="312" y="255" width="6" height="6" rx="1" fill="#1b8a72"/>

  <!-- TEAM label -->
  <text
    x="330" y="268"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-weight="300"
    font-size="16"
    fill="#6a6a6a"
    letter-spacing="8">TEAM</text>

  <!-- Micro tagline -->
  <text
    x="330" y="292"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-weight="300"
    font-size="11"
    fill="#aaaaaa"
    letter-spacing="3">DIGITAL EVOLUTION</text>

</svg>
